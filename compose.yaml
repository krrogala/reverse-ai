services:
  human-1:
    build: .
    image: human-1
    env_file: .env
    ports:
      # Bound to this machine only. There is no login, so anyone who can reach
      # the port can spend your model credits.
      # If you change the host port, add it to REVERSE_AI_ALLOWED_HOSTS in .env
      # (for example localhost:8080) or the server will answer 403.
      - "127.0.0.1:4517:4517"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
